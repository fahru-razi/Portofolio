<dialog id="formDialog" class="dialog" aria-labelledby="formDialogTitle">
  <form id="formDialogForm" novalidate>
    <header class="dialog-head">
      <h2 id="formDialogTitle"></h2>
      <button type="button" class="btn btn-ghost btn-icon" data-close aria-label="Tutup"><svg class="ic"><use href="#i-x"/></svg></button>
    </header>
    <div class="dialog-body"><div id="formDialogBody" class="stack"></div><p id="formDialogError" class="form-error" role="alert" hidden></p></div>
    <footer class="dialog-foot">
      <button type="button" class="btn btn-ghost" data-close>Batal</button>
      <button type="submit" class="btn btn-primary" id="formDialogSubmit">Simpan</button>
    </footer>
  </form>
</dialog>
<dialog id="confirmDialog" class="dialog dialog-sm" aria-labelledby="confirmTitle">
  <form method="dialog">
    <header class="dialog-head"><h2 id="confirmTitle"></h2></header>
    <div class="dialog-body"><p id="confirmMessage" class="muted"></p></div>
    <footer class="dialog-foot">
      <button type="submit" value="cancel" class="btn btn-ghost">Batal</button>
      <button type="submit" value="ok" class="btn btn-primary" id="confirmOk">Lanjutkan</button>
    </footer>
  </form>
</dialog>

<dialog id="notifDialog" class="dialog" aria-labelledby="notifTitle">
  <div class="dialog-head"><h2 id="notifTitle">Notifikasi</h2>
    <button type="button" class="btn btn-ghost btn-icon" data-close aria-label="Tutup notifikasi"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div class="dialog-body"><div id="notifBody" aria-live="polite"></div></div>
  <div class="dialog-foot"><button type="button" class="btn btn-ghost" id="notifReadAll">Tandai semua dibaca</button><button type="button" class="btn btn-ghost" id="notifClear">Hapus semua</button></div>
</dialog>
